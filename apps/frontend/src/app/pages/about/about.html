<section class="about sa-container">
  <p class="about__eyebrow" saReveal>{{ 'about.eyebrow' | t }}</p>
  <h1 saReveal class="sa-reveal-delay-1">
    {{ 'about.title' | t }}<br /><em>{{ 'about.em' | t }}</em>
  </h1>
  <div class="about__grid">
    <p saReveal>{{ 'about.p1' | t }}</p>
    <p saReveal class="sa-reveal-delay-2">{{ 'about.p2' | t }}</p>
  </div>
  <ul class="about__facts" saReveal>
    <li><strong>12</strong><span>{{ 'about.fact1' | t }}</span></li>
    <li><strong>4</strong><span>{{ 'about.fact2' | t }}</span></li>
    <li><strong>EU</strong><span>{{ 'about.fact3' | t }}</span></li>
  </ul>
</section>
