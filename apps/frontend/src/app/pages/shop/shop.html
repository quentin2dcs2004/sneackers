<section class="shop sa-container">
  <header class="shop__hero" saReveal>
    <p>{{ 'shop.catalog' | t }}</p>
    <h1>{{ 'shop.title' | t }}</h1>
    <button class="shop__filter-btn" type="button" (click)="filtersOpen.set(!filtersOpen())">
      {{ (filtersOpen() ? 'shop.hideFilters' : 'shop.filters') | t }}
    </button>
  </header>

  <div class="shop__layout">
    <aside class="filters" [class.filters--open]="filtersOpen()">
      <label>
        {{ 'shop.search' | t }}
        <input [(ngModel)]="q" (ngModelChange)="load()" [placeholder]="'shop.placeholder' | t" />
      </label>
      <label>
        {{ 'shop.category' | t }}
        <select [(ngModel)]="category" (ngModelChange)="load()">
          <option value="">{{ 'shop.all' | t }}</option>
          @for (c of categories(); track c.id) {
            <option [value]="c.slug">{{ c.name }}</option>
          }
        </select>
      </label>
      <label>
        {{ 'shop.brand' | t }}
        <select [(ngModel)]="brand" (ngModelChange)="load()">
          <option value="">{{ 'shop.all' | t }}</option>
          @for (b of brandOptions(); track b) {
            <option [value]="b">{{ b }}</option>
          }
        </select>
      </label>
      <div class="filters__prices">
        <label>
          {{ 'shop.min' | t }}
          <input type="number" name="minPrice" [(ngModel)]="minPrice" (change)="load()" />
        </label>
        <label>
          {{ 'shop.max' | t }}
          <input type="number" name="maxPrice" [(ngModel)]="maxPrice" (change)="load()" />
        </label>
      </div>
      <button class="sa-btn sa-btn--ghost" type="button" (click)="reset()">{{ 'shop.reset' | t }}</button>
    </aside>

    <div>
      <p class="shop__count">{{ products().length }} {{ 'shop.count' | t }}</p>
      <div class="shop__grid">
        @for (p of products(); track p.id; let i = $index) {
          <app-product-card [product]="p" [index]="i" />
        }
      </div>
    </div>
  </div>
</section>
