@if (product(); as p) {
  <section class="product">
    <div class="product__stage">
      <app-shoe-viewer
        [brand]="p.brand"
        [name]="p.name"
        [colorway]="p.colorway"
        [slug]="p.slug"
      />
    </div>

    <div class="product__panel sa-container">
      <a class="product__back" routerLink="/shop">{{ 'product.back' | t }}</a>
      <div class="product__info">
        <p class="product__brand">{{ p.brand }} · {{ p.categoryName }}</p>
        <h1>{{ p.name }}</h1>
        <p class="product__price">{{ p.price | currency: 'EUR' }}</p>
        <p class="product__color">{{ p.colorway }}</p>
        <p class="product__desc">{{ p.description }}</p>

        <div class="product__sizes">
          <p>{{ 'product.size' | t }}</p>
          <div>
            @for (s of sizeOptions(); track s) {
              <button type="button" [class.is-on]="selectedSize === s" (click)="selectedSize = s">{{ s }}</button>
            }
          </div>
        </div>

        <button class="sa-btn product__cta" type="button" (click)="add()">
          {{ (added() ? 'product.added' : 'product.add') | t }}
        </button>
      </div>
    </div>
  </section>
}
