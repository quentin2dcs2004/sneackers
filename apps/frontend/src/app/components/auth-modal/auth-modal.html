@if (ui.authOpen()) {
  <div class="auth" role="dialog" aria-modal="true">
    <button class="auth__backdrop" type="button" [attr.aria-label]="'cart.close' | t" (click)="ui.closeAuth()"></button>
    <div class="auth__panel">
      <header>
        <h2>{{ (ui.authMode() === 'login' ? 'auth.welcome' : 'auth.join') | t }}</h2>
        <button type="button" (click)="ui.closeAuth()">×</button>
      </header>

      <form (ngSubmit)="submit()">
        @if (ui.authMode() === 'register') {
          <label>
            {{ 'auth.name' | t }}
            <input name="fullName" [(ngModel)]="fullName" required autocomplete="name" />
          </label>
        }
        <label>
          {{ 'auth.email' | t }}
          <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
        </label>
        <label>
          {{ 'auth.password' | t }}
          <input type="password" name="password" [(ngModel)]="password" required minlength="6" autocomplete="current-password" />
        </label>

        @if (error()) {
          <p class="auth__error">{{ error() }}</p>
        }

        <button class="sa-btn" type="submit" [disabled]="busy()">
          {{ (ui.authMode() === 'login' ? 'auth.login' : 'auth.register') | t }}
        </button>
      </form>

      <p class="auth__switch">
        @if (ui.authMode() === 'login') {
          {{ 'auth.noAccount' | t }}
          <button type="button" (click)="ui.openAuth('register')">{{ 'auth.register' | t }}</button>
        } @else {
          {{ 'auth.hasAccount' | t }}
          <button type="button" (click)="ui.openAuth('login')">{{ 'auth.login' | t }}</button>
        }
      </p>
    </div>
  </div>
}
